
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Amharic - ሀ ሁ ሂ ሃ ሄ ህ ሆ</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #fff8e8;
        text-align: center;
        margin: 0;
        padding: 15px;
    }

    h1 {
        color: #174ea6;
        font-size: 30px;
    }

    p {
        font-size: 19px;
    }

    .letters {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
        gap: 12px;
        max-width: 900px;
        margin: 20px auto;
    }

    .card {
        background: white;
        border: 3px solid #f0c75e;
        border-radius: 18px;
        padding: 12px 5px;
        box-shadow: 0 4px 8px #00000015;
    }

    .letter {
        font-family: "Noto Sans Ethiopic", Nyala, sans-serif;
        font-size: 76px;
        font-weight: bold;
        color: #d62828;
        line-height: 1.3;
    }

    .word {
        font-family: "Noto Sans Ethiopic", Nyala, sans-serif;
        font-size: 35px;
        font-weight: bold;
        color: #174ea6;
        margin: 5px;
    }

    .sound {
        font-size: 19px;
        font-weight: bold;
        color: #333;
        margin: 8px;
    }

    button {
        background: #087f5b;
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px 15px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        margin: 5px;
    }

    button:hover {
        background: #065f46;
    }

    .repeat-all {
        background: #174ea6;
        font-size: 20px;
        padding: 15px 22px;
    }

    #message {
        color: #174ea6;
        font-size: 17px;
        margin: 15px;
    }
</style>
</head>

<body>

<h1>የአማርኛ ፊደላት እንማር!</h1>
<p>Learn Amharic Letters and Words</p>
<p>🔊 Press the green button to hear each word!</p>

<div class="letters" id="letters"></div>

<button class="repeat-all" onclick="readAll()">
    🔊 Read All Words
</button>

<p id="message">Ready to learn! እንማር!</p>

<script>
const lessons = [
    { letter: "ሀ", sound: "Ha", word: "ሀብት" },
    { letter: "ሁ", sound: "Hu", word: "ሁለት" },
    { letter: "ሂ", sound: "Hi", word: "ሂሳብ" },
    { letter: "ሃ", sound: "Ha", word: "ሃይማኖት" },
    { letter: "ሄ", sound: "He", word: "ሄሊኮፕተር" },
    { letter: "ህ", sound: "Hə", word: "ህግ" },
    { letter: "ሆ", sound: "Ho", word: "ሆድ" }
];

const container = document.getElementById("letters");

lessons.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <div class="letter">${item.letter}</div>
        <div class="sound">${item.sound}</div>
        <div class="word">${item.word}</div>
        <button onclick="speakWord(${index})">
            🔊 Hear Word
        </button>
    `;

    container.appendChild(card);
});

function speakWord(index) {
    if (!("speechSynthesis" in window)) {
        document.getElementById("message").textContent =
            "Speech is not supported in this browser.";
        return;
    }

    speechSynthesis.cancel();

    const item = lessons[index];
    const utterance = new SpeechSynthesisUtterance(item.word);

    utterance.lang = "am-ET";
    utterance.rate = 0.75;
    utterance.pitch = 1.1;
    utterance.volume = 1;

    const voices = speechSynthesis.getVoices();
    const amharicVoice = voices.find(v =>
        v.lang.toLowerCase().startsWith("am")
    );

    if (amharicVoice) {
        utterance.voice = amharicVoice;
    }

    document.getElementById("message").textContent =
        "Listen and repeat: " + item.word;

    speechSynthesis.speak(utterance);
}

function readAll() {
    let index = 0;

    if (!("speechSynthesis" in window)) {
        document.getElementById("message").textContent =
            "Speech is not supported in this browser.";
        return;
    }

    speechSynthesis.cancel();

    function nextWord() {
        if (index >= lessons.length) {
            document.getElementById("message").textContent =
                "Great job! በጣም ጥሩ!";
            return;
        }

        const item = lessons[index];
        const utterance = new SpeechSynthesisUtterance(item.word);

        utterance.lang = "am-ET";
        utterance.rate = 0.75;
        utterance.pitch = 1.1;
        utterance.volume = 1;

        const voices = speechSynthesis.getVoices();
        const amharicVoice = voices.find(v =>
            v.lang.toLowerCase().startsWith("am")
        );

        if (amharicVoice) {
            utterance.voice = amharicVoice;
        }

        document.getElementById("message").textContent =
            "Listen: " + item.word;

        utterance.onend = () => {
            index++;
            setTimeout(nextWord, 500);
        };

        utterance.onerror = () => {
            document.getElementById("message").textContent =
                "Your browser may not support Amharic speech.";
        };

        speechSynthesis.speak(utterance);
    }

    nextWord();
}
</script>

</body>
</html>
